name: CI

# Dependency vulnerability scanning (spec: Security Hardening → Dependency hygiene).
# Runs on every PR and on pushes to main. The docs Pages build lives in pages.yml
# and is intentionally left untouched.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: npm test (95% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches local development; the built-in test runner's coverage
          # flags used by `npm test` require Node 20+.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install from committed lockfile
        run: npm ci

      - name: Run tests (fails below 95% line/branch/function coverage)
        run: npm test

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install from committed lockfile
        run: npm ci

      - name: Audit (advisory — does not fail the build yet)
        # Deliberately softer than the Python gate: npm's transitive dev-dep
        # advisories are noisy. Reports High+ findings without failing; flip to
        # gating (drop the `|| true`) once the frontend baseline is clean.
        run: npm audit --audit-level=high || true
