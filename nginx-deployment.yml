apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-api-deploy
  labels:
    app: nginx-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-api
  template:
    metadata:
      labels:
        app: nginx-api
    spec:
      containers:
        - name: nginx-api
          image: fsep-node-express-api-api:v1
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              value: mongodb://mongo:27017
            - name: MONGODB_DB
              value: books
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20            
---
# Service for the API pods. NodePort so the API is reachable from outside the
# cluster at <node-ip>:30080; in-cluster clients still use books-api:3000.
apiVersion: v1
kind: Service
metadata:
  name: books-api
  labels:
    app: nginx-api
spec:
  type: NodePort
  selector:
    app: nginx-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-client-deploy
  labels:
    app: books-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: books-client
  template:
    metadata:
      labels:
        app: books-client
    spec:
      containers:
        - name: books-client
          # Image built from client/Dockerfile (nginx serving the React SPA).
          image: fsep-node-express-api-web:v1
          ports:
            - containerPort: 80
          env:
            # nginx proxies /api/ and /api-docs to this upstream. Must be the
            # fully-qualified service name: nginx's `resolver` does not apply
            # the /etc/resolv.conf search domains, so a bare `books-api` fails
            # to resolve in-cluster. Swap `default` for your namespace.
            - name: API_URL
              value: http://books-api.default.svc.cluster.local:3000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: books-client
  labels:
    app: books-client
spec:
  # Change to LoadBalancer (or add an Ingress) to expose the SPA outside the cluster.
  type: ClusterIP
  selector:
    app: books-client
  ports:
    - port: 80
      targetPort: 80
---
# MongoDB (from the docker-compose `mongo` service). StatefulSet + a headless
# Service give it a stable network id and a per-pod PersistentVolumeClaim,
# replacing compose's named `mongo-data` volume.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Exposes the SPA outside the cluster. Needs an ingress controller installed
# (e.g. ingress-nginx). All paths go to books-client, whose nginx already
# proxies /api and /api-docs to the API service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: books-client
  labels:
    app: books-client
spec:
  ingressClassName: nginx
  rules:
    - host: books.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: books-client
                port:
                  number: 80